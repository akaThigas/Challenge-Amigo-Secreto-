<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;400;700;900&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <title>Sorteador</title>
</head>

<body>
    <main class="main-content">
        <header class="header-banner">
            <h1 class="main-title">Sorteador</h1>
            <img src="assets/sorteador.svg" alt="Dois dados">
        </header>
        
        <section class="input-section">
            <h2 id="tituloLista" class="section-title">Digite os nomes do sorteio</h2>
            <div class="input-wrapper">
                <input type="text" id="nome" class="input-name" placeholder="Digite um nome">
                <button class="button-add" onclick="adicionarNome()">Adicionar</button>
            </div>
            <p id="mensagem" class="error-message" role="alert" hidden></p>

            <p id="contador" class="name-count">Nenhum nome adicionado ainda.</p>
            <ul id="listaNomes" class="name-list" aria-labelledby="tituloLista" role="list"></ul>
            <ul id="resultado" class="result-list" aria-live="polite"></ul>

            <div class="button-container">
                <button class="button-draw" onclick="sortearNome()" aria-label="Sortear um nome">
                    <img src="assets/play_circle_outline.svg" alt="" aria-hidden="true">
                    Sortear
                </button>
            </div>
        </section>
    </main>

    <script src="app.js" defer></script>
</body>
</html>
